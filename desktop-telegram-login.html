<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход через Telegram — Emerva Tools</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#0b0c0f;color:#f2f2f2;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  .card{text-align:center;padding:40px;max-width:380px;}
  h1{font-size:18px;margin:0 0 8px;}
  p{font-size:13px;color:#9a9a9a;margin:0 0 24px;}
  #status{margin-top:20px;font-size:13px;color:#9a9a9a;min-height:18px;}
  #status.error{color:#ff8a8a;}
  .open-app-btn{display:none;margin-top:18px;background:#29A9EB;color:#fff;text-decoration:none;
    padding:12px 22px;border-radius:10px;font-size:14px;font-weight:600;}
  .open-app-btn.show{display:inline-block;}
</style>
</head>
<body>
  <div class="card">
    <h1>Emerva Tools</h1>
    <p>Войди через Telegram, чтобы вернуться в приложение уже авторизованным.</p>
    <div id="widget-holder"></div>
    <a href="#" id="openAppBtn" class="open-app-btn">Открыть Emerva Tools →</a>
    <div id="status"></div>
  </div>

  <script>
    var statusEl = document.getElementById('status');
    var openBtn = document.getElementById('openAppBtn');

    function setStatus(text, isError) {
      statusEl.textContent = text;
      statusEl.className = isError ? 'error' : '';
    }

    // ВАЖНО: если юзернейм бота другой — поменяй 'emerva_tools_bot' ниже,
    // и убедись что этот домен (emervatools.space) добавлен в @BotFather -> /setdomain для этого бота.
    var script = document.createElement('script');
    script.src = 'https://telegram.org/js/telegram-widget.js?22';
    script.setAttribute('data-telegram-login', 'emerva_tools_bot');
    script.setAttribute('data-size', 'large');
    script.setAttribute('data-onauth', 'onTelegramAuth(user)');
    script.setAttribute('data-request-access', 'write');
    script.onerror = function () {
      setStatus('Не удалось загрузить виджет Telegram (проверь интернет-соединение или блокировщик рекламы).', true);
    };
    document.getElementById('widget-holder').appendChild(script);

    // если сам скрипт виджета вообще не подгрузился за разумное время — тоже сообщаем
    setTimeout(function () {
      if (!document.querySelector('#widget-holder iframe')) {
        setStatus('Кнопка Telegram не появилась. Возможно, домен ещё не подтверждён в @BotFather (/setdomain) — попробуй позже.', true);
      }
    }, 4000);

    function onTelegramAuth(user) {
      try {
        setStatus('Готово! Нажми кнопку ниже, чтобы вернуться в приложение.');
        var payload = encodeURIComponent(btoa(JSON.stringify(user)));
        var deepLink = 'emerva://auth-callback?telegram=' + payload;
        openBtn.href = deepLink;
        openBtn.classList.add('show');

        // пробуем автоматически — сработает у части браузеров, но кнопка выше
        // остаётся основным и надёжным способом, если браузер тихо заблокирует авто-переход
        window.location.href = deepLink;
      } catch (e) {
        setStatus('Ошибка при подготовке входа: ' + e.message, true);
      }
    }
  </script>
</body>
</html>
