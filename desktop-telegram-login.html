<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход через Telegram — Emerva Tools</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#0b0c0f;color:#f2f2f2;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  .card{text-align:center;padding:40px;max-width:360px;}
  .card img{width:56px;height:56px;margin-bottom:16px;}
  h1{font-size:18px;margin:0 0 8px;}
  p{font-size:13px;color:#9a9a9a;margin:0 0 24px;}
  #status{margin-top:20px;font-size:13px;color:#9a9a9a;}
</style>
</head>
<body>
  <div class="card">
    <h1>Emerva Tools</h1>
    <p>Войди через Telegram, чтобы вернуться в приложение уже авторизованным.</p>
    <div id="widget-holder"></div>
    <div id="status"></div>
  </div>

  <script>
    // ВАЖНО: замени emerva_tools_bot на реальный юзернейм бота, если он другой,
    // и добавь этот домен (emervatools.space) в @BotFather -> /setdomain для этого бота.
    var script = document.createElement('script');
    script.src = 'https://telegram.org/js/telegram-widget.js?22';
    script.setAttribute('data-telegram-login', 'emerva_tools_bot');
    script.setAttribute('data-size', 'large');
    script.setAttribute('data-onauth', 'onTelegramAuth(user)');
    script.setAttribute('data-request-access', 'write');
    document.getElementById('widget-holder').appendChild(script);

    function onTelegramAuth(user) {
      document.getElementById('status').textContent = 'Возвращаемся в приложение…';
      var payload = encodeURIComponent(btoa(JSON.stringify(user)));
      var deepLink = 'emerva://auth-callback?telegram=' + payload;
      window.location.href = deepLink;
      // на случай если ОС не подхватила протокол автоматически
      setTimeout(function () {
        document.getElementById('status').textContent =
          'Если приложение не открылось само — просто вернись в Emerva Tools, вход уже прошёл.';
      }, 1500);
    }
  </script>
</body>
</html>
